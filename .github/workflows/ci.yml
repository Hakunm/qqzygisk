name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Grant Gradle
        run: chmod +x gradlew

      - name: Assemble release module
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: qqhook
          path: app/build/outputs/magisk/release/qqhook.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download module zip
        uses: actions/download-artifact@v4
        with:
          name: qqhook
          path: dist

      - name: Write update.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          version_code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          cat > dist/update.json <<EOF
          {
            "version": "${version_name:-$TAG}",
            "versionCode": ${version_code:-0},
            "zipUrl": "https://raw.githubusercontent.com/${REPO}/master/qqhook.zip",
            "changelog": "https://raw.githubusercontent.com/${REPO}/master/changelog.md"
          }
          EOF
          cp changelog.md dist/changelog.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qqhook.zip
            dist/update.json
            dist/changelog.md
          generate_release_notes: true
          fail_on_unmatched_files: true
